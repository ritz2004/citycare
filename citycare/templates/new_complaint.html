<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityCare | New Complaint</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="{{ url_for('dashboard') }}" class="logo">CityCare</a>

    <div class="nav-links">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="form-card">
        <h2>Submit a Complaint</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('new_complaint') }}">

            <div class="form-group">
                <label>Complaint Title</label>
                <input type="text" name="title" required maxlength="150">
            </div>

            <div class="form-group">
                <label>Complaint Category</label>

                <select name="category" required>
                    <option value="">Select Category</option>
                    <option value="Roads">Road Problems</option>
                    <option value="Water Supply">Water Supply</option>
                    <option value="Electricity">Electricity</option>
                    <option value="Garbage">Garbage Management</option>
                    <option value="Drainage">Drainage</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Complaint Location</label>
                <input type="text" name="location"
                       placeholder="Enter area or address"
                       required maxlength="200">
            </div>

            <div class="form-group">
                <label>Complaint Description</label>
                <textarea name="description"
                          placeholder="Explain the problem..."
                          required maxlength="3000"></textarea>
            </div>

            <button type="submit" class="btn">
                Submit Complaint
            </button>

        </form>

        <p class="form-footer">
            <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
        </p>
    </div>

</div>

<footer>
    <p>CityCare | Complaint Management</p>
</footer>

</body>
</html>
